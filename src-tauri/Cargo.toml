[package]
name = "vellumstyle"
version = "1.9.9"
description = "文澜排版"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vellumstyle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-dialog = "2"
base64 = "0.22.1"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["sync", "fs", "macros", "net", "rt-multi-thread", "time"] }
http = "1"
urlencoding = "2"
url = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
resvg = { version = "0.45.1", features = ["text"] }
roxmltree = "0.20"

tauri-plugin-clipboard-manager = "2.3.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
jpeg-encoder = { version = "0.6.1", features = ["simd"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = "0.61.3"

[profile.dev]
opt-level = 2

# 发布档：Tauri v2 官方推荐配置（https://v2.tauri.app/concept/size/）。
# 体积/启动时间收益主要来自 strip 与 lto；代价是 release 构建变慢，
# macOS universal 那个 job 本来就编两份架构，注意别撞 60 分钟超时。
#
# 故意没开 `panic = "abort"`：它取消 unwind，panic 直接结束整个进程
# （干净崩溃 + 重启，而不是留下静默损坏的中间状态）。
#
# 注意别把它和"清理 unwrap"捆在一起：生产代码的 panic 面本来就很小 ——
# `wechat/token.rs` 4 处 `Mutex::lock().unwrap()`（只有锁被 poison 才触发），
# `preview_image/asset.rs` 与 `preview_image/commands.rs` 各 1 处 `unreachable!()`
# （在 `if kind == Svg { return }` 之后，只为 match 穷尽性存在，证明不可达）。
# 其余 unwrap/expect 全在测试模块里。
# 所以这是纯粹的崩溃语义取舍，随时可单独决定开或不开。
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
