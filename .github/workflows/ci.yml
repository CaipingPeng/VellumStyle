name: CI

# PR/推送门禁：测试 + 类型检查 + 前端构建，任何破坏性改动在合并前暴露，
# 而不是等到发布 tag 时才在 release.yml 里发现。
on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Test / typecheck / build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
