name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      windows_only:
        description: "只重新构建 Windows 资产"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      release_body: ${{ steps.release_notes.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test -- --test-force-exit

      - name: Install Linux system dependencies for Rust tests
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Read release notes
        id: release_notes
        shell: bash
        run: |
          notes_path="release-notes.md"
          if [[ ! -f "$notes_path" ]]; then
            echo "Missing release notes file: $notes_path" >&2
            exit 1
          fi

          notes="$(sed -e '${/^$/d;}' "$notes_path")"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "release-notes.md is empty" >&2
            exit 1
          fi
          if grep -Eq 'vX\.X\.X|X\.X\.X|TODO|待补充' <<<"$notes"; then
            echo "release-notes.md still contains placeholder content" >&2
            exit 1
          fi

          delimiter="RELEASE_NOTES_$(date +%s%N)"
          {
            echo "body<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-2022
            rust_targets: x86_64-pc-windows-msvc
            tauri_args: --target x86_64-pc-windows-msvc --bundles msi,nsis
            include_updater_json: true
          - name: Linux x64
            platform: ubuntu-24.04
            rust_targets: x86_64-unknown-linux-gnu
            tauri_args: --target x86_64-unknown-linux-gnu --bundles deb,appimage
            include_updater_json: false
          - name: macOS Universal
            platform: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin --bundles dmg
            include_updater_json: false

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ matrix.name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows updater signing key
        if: matrix.name == 'Windows x64'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_INPUT)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is empty'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'tauri-signing-private.key'
          [System.IO.File]::WriteAllText(
            $keyPath,
            $env:TAURI_SIGNING_PRIVATE_KEY_INPUT,
            [System.Text.UTF8Encoding]::new($false)
          )
          "TAURI_SIGNING_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare Unix updater signing key
        if: matrix.name != 'Windows x64'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_INPUT: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY_INPUT//[[:space:]]/}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is empty" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/tauri-signing-private.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY_INPUT" > "$key_path"
          printf 'TAURI_SIGNING_PRIVATE_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Build and publish Tauri app
        if: github.event_name != 'workflow_dispatch' || !inputs.windows_only || matrix.name == 'Windows x64'
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "VellumStyle v__VERSION__"
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ matrix.include_updater_json }}
          updaterJsonPreferNsis: true
          tauriScript: npx tauri
          args: ${{ matrix.tauri_args }}
